<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Оренда квартир</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>Список квартир</h2>
        <button class="btn btn-primary mb-3" onclick="showAddForm()">Додати нову квартиру</button>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Адреса</th>
                    <th>Площа (м кв.)</th>
                    <th>Кількість кімнат</th>
                    <th>Ціна на місяць (в гривнях)</th>
                    <th>Район</th>
                    <th>Дії</th>
                </tr>
            </thead>
            <tbody id="flats"></tbody>
        </table>
    </div>

    <div class="modal fade" id="flatModal" tabindex="-1" aria-labelledby="flatModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="flatForm" onsubmit="submitFlat(event)">
                    <div class="modal-header">
                        <h5 class="modal-title" id="flatModalLabel">Нова квартира</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="flatId">
                        <div class="mb-3">
                            <label for="flAddr" class="form-label">Адреса</label>
                            <input type="text" class="form-control" id="flAddr" required oninvalid="this.setCustomValidity('Поле не має бути порожнім')" oninput="this.setCustomValidity('')">
                        </div>
                        <div class="mb-3">
                            <label for="flArea" class="form-label">Площа (в метрах квадратних)</label>
                            <input type="number" min="1" class="form-control" id="flArea" required oninvalid="this.setCustomValidity('Поле не має бути порожнім')" oninput="this.setCustomValidity('')">
                        </div>
                        <div class="mb-3">
                            <label for="flRooms" class="form-label">Кількість кімнат</label>
                            <input type="number" min="1" class="form-control" id="flRooms" required oninvalid="this.setCustomValidity('Поле не має бути порожнім')" oninput="this.setCustomValidity('')">
                        </div>
                        <div class="mb-3">
                            <label for="flPrice" class="form-label">Ціна на місяць (в гривнях)</label>
                            <input type="number" min="1" class="form-control" id="flPrice" required oninvalid="this.setCustomValidity('Поле не має бути порожнім')" oninput="this.setCustomValidity('')">
                        </div>
                        <div class="mb-3">
                            <label for="districtId" class="form-label">Район</label>
                            <select class="form-select" id="districtId" required oninvalid="this.setCustomValidity('Поле не має бути порожнім')" oninput="this.setCustomValidity('')"></select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
                        <button type="submit" class="btn btn-primary">Зберегти</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/lab2.js"></script>
</body>
</html>
